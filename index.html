<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weekly Timesheet</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f1117" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:        #0f1117;
    --surface:   #181c24;
    --card:      #1e2330;
    --border:    #2a3040;
    --accent:    #3b82f6;
    --accent-hi: #60a5fa;
    --green:     #22c55e;
    --red:       #ef4444;
    --amber:     #f59e0b;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }

  .header-left h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .header-left .week-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .week-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .week-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .week-nav button:hover { background: var(--border); border-color: var(--accent); }

  .total-banner {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .total-banner .stat { display: flex; flex-direction: column; gap: 2px; }
  .total-banner .stat-val {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--accent-hi);
  }
  .total-banner .stat-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .divider { width: 1px; height: 36px; background: var(--border); }

  .days-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .day-card.is-today { border-color: var(--accent); }
  .day-card.is-weekend { opacity: 0.75; }

  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }

  .day-name-block { display: flex; align-items: baseline; gap: 10px; }

  .day-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .day-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .today-badge {
    font-size: 9px;
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    padding: 2px 7px;
  }

  .day-total {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    min-width: 70px;
    text-align: right;
  }

  .day-body { padding: 12px 16px; }

  .entries-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

  .entry-row {
    display: grid;
    grid-template-columns: 80px 80px 70px 1fr 28px;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .entry-row .time-in  { color: var(--green); }
  .entry-row .time-out { color: var(--red); }
  .entry-row .duration { color: var(--amber); font-weight: 600; }
  .entry-row .note-field {
    background: transparent;
    border: none;
    outline: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    width: 100%;
    min-width: 0;
  }
  .entry-row .note-field::placeholder { color: #3a4455; }

  .btn-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 0;
    line-height: 1;
    transition: color 0.15s;
  }
  .btn-del:hover { color: var(--red); }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn-stamp {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1.5px solid;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.5px;
  }

  .btn-stamp:active { transform: scale(0.96); }

  .btn-in  {
    background: rgba(34,197,94,0.12);
    border-color: var(--green);
    color: var(--green);
  }
  .btn-in:hover { background: rgba(34,197,94,0.22); }

  .btn-out {
    background: rgba(239,68,68,0.12);
    border-color: var(--red);
    color: var(--red);
  }
  .btn-out:hover { background: rgba(239,68,68,0.22); }

  .btn-manual {
    background: rgba(59,130,246,0.10);
    border-color: var(--accent);
    color: var(--accent-hi);
    font-size: 11px;
    padding: 8px 12px;
  }
  .btn-manual:hover { background: rgba(59,130,246,0.20); }

  .empty-state {
    font-family: var(--mono);
    font-size: 11px;
    color: #2e3848;
    padding: 6px 0 10px;
    letter-spacing: 0.5px;
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 320px;
    max-width: 90vw;
  }

  .modal h2 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--accent-hi);
    letter-spacing: 0.5px;
  }

  .modal label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }

  .modal input[type="time"],
  .modal input[type="text"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  .modal input:focus { border-color: var(--accent); }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  .modal-btns button {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    border: 1.5px solid;
    transition: background 0.15s;
  }

  .btn-cancel { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-cancel:hover { border-color: var(--muted); }
  .btn-confirm { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-confirm:hover { background: var(--accent-hi); }

  footer {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: #2a3040;
    margin-top: 32px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  @media (max-width: 520px) {
    .entry-row { grid-template-columns: 72px 72px 60px 1fr 24px; font-size: 11px; }
    .total-banner { gap: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>TIMESHEET</h1>
    <div class="week-label" id="week-label">Loading...</div>
  </div>
  <div class="week-nav">
    <button onclick="shiftWeek(-1)">&#8592; Prev</button>
    <button onclick="shiftWeek(0)">This Week</button>
    <button onclick="shiftWeek(1)">Next &#8594;</button>
  </div>
</header>

<div class="total-banner">
  <div class="stat">
    <span class="stat-val" id="total-hours">0h 00m</span>
    <span class="stat-lbl">Total this week</span>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <span class="stat-val" id="total-sessions">0</span>
    <span class="stat-lbl">Sessions logged</span>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <span class="stat-val" id="avg-day">0h 00m</span>
    <span class="stat-lbl">Avg per work day</span>
  </div>
</div>

<div class="days-grid" id="days-grid"></div>

<!-- Manual entry modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2>Manual Entry</h2>
    <label>Clock In</label>
    <input type="time" id="m-in" />
    <label>Clock Out</label>
    <input type="time" id="m-out" />
    <label>Note (optional)</label>
    <input type="text" id="m-note" placeholder="e.g. deep work, meeting..." />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmManual()">Add Entry</button>
    </div>
  </div>
</div>

<footer>data stored locally in your browser &mdash; no server, no sync</footer>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SHORT = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

let weekOffset = 0;
let data = JSON.parse(localStorage.getItem('ts_data') || '{}');
let pendingDay = null;
let pendingType = null; // 'in' or 'manual'

function save() {
  localStorage.setItem('ts_data', JSON.stringify(data));
}

function getMondayOf(offset) {
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(now);
  mon.setDate(now.getDate() + diff + offset * 7);
  mon.setHours(0,0,0,0);
  return mon;
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmt(d) {
  return d.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit', hour12: false});
}

function formatDur(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}h ${String(m).padStart(2,'0')}m`;
}

function calcDur(inTime, outTime) {
  const [ih, im] = inTime.split(':').map(Number);
  const [oh, om] = outTime.split(':').map(Number);
  return (oh * 60 + om) - (ih * 60 + im);
}

function nowHHMM() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}

function shiftWeek(n) {
  weekOffset = n === 0 ? 0 : weekOffset + n;
  render();
}

function clockIn(key) {
  if (!data[key]) data[key] = { entries: [], open: null };
  if (data[key].open !== null) {
    alert('You have an open clock-in. Clock out first.');
    return;
  }
  data[key].open = nowHHMM();
  save();
  render();
}

function clockOut(key) {
  if (!data[key] || data[key].open === null) {
    alert('No active clock-in for this day.');
    return;
  }
  const inT = data[key].open;
  const outT = nowHHMM();
  const dur = calcDur(inT, outT);
  if (dur <= 0) {
    alert('Clock-out time must be after clock-in time.');
    return;
  }
  data[key].entries.push({ in: inT, out: outT, note: '' });
  data[key].open = null;
  save();
  render();
}

function openManual(key) {
  pendingDay = key;
  pendingType = 'manual';
  document.getElementById('m-in').value = '';
  document.getElementById('m-out').value = '';
  document.getElementById('m-note').value = '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  pendingDay = null;
}

function confirmManual() {
  const inT = document.getElementById('m-in').value;
  const outT = document.getElementById('m-out').value;
  const note = document.getElementById('m-note').value.trim();
  if (!inT || !outT) { alert('Please enter both clock-in and clock-out times.'); return; }
  const dur = calcDur(inT, outT);
  if (dur <= 0) { alert('Clock-out must be after clock-in.'); return; }
  if (!data[pendingDay]) data[pendingDay] = { entries: [], open: null };
  data[pendingDay].entries.push({ in: inT, out: outT, note });
  save();
  closeModal();
  render();
}

function deleteEntry(key, idx) {
  data[key].entries.splice(idx, 1);
  save();
  render();
}

function updateNote(key, idx, val) {
  data[key].entries[idx].note = val;
  save();
}

function render() {
  const monday = getMondayOf(weekOffset);
  const today = dateKey(new Date());

  // Week label
  const end = new Date(monday); end.setDate(monday.getDate() + 6);
  document.getElementById('week-label').textContent =
    `Week of ${monday.toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'numeric'})} – ${end.toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'numeric'})}`;

  const grid = document.getElementById('days-grid');
  grid.innerHTML = '';

  let totalMins = 0;
  let totalSessions = 0;
  let workDaysWithEntries = 0;

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = dateKey(d);
    const isToday = key === today;
    const isWeekend = i >= 5;
    const dayData = data[key] || { entries: [], open: null };

    let dayMins = 0;
    dayData.entries.forEach(e => { dayMins += calcDur(e.in, e.out); });
    if (dayData.open) {
      const now = nowHHMM();
      const running = calcDur(dayData.open, now);
      if (running > 0) dayMins += running;
    }
    totalMins += dayMins;
    totalSessions += dayData.entries.length;
    if (!isWeekend && dayData.entries.length > 0) workDaysWithEntries++;

    const card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' is-today' : '') + (isWeekend ? ' is-weekend' : '');

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'day-header';

    const nameBlock = document.createElement('div');
    nameBlock.className = 'day-name-block';

    const namEl = document.createElement('span');
    namEl.className = 'day-name';
    namEl.textContent = SHORT[i];

    const dateEl = document.createElement('span');
    dateEl.className = 'day-date';
    dateEl.textContent = d.toLocaleDateString('en-AU', {day:'numeric', month:'short'});

    nameBlock.appendChild(namEl);
    nameBlock.appendChild(dateEl);

    if (isToday) {
      const badge = document.createElement('span');
      badge.className = 'today-badge';
      badge.textContent = 'Today';
      nameBlock.appendChild(badge);
    }

    const dayTotalEl = document.createElement('span');
    dayTotalEl.className = 'day-total';
    dayTotalEl.textContent = dayMins > 0 ? formatDur(dayMins) : '--';

    hdr.appendChild(nameBlock);
    hdr.appendChild(dayTotalEl);

    // Body
    const body = document.createElement('div');
    body.className = 'day-body';

    const list = document.createElement('div');
    list.className = 'entries-list';

    if (dayData.entries.length === 0 && !dayData.open) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No entries yet.';
      list.appendChild(empty);
    } else {
      dayData.entries.forEach((e, idx) => {
        const row = document.createElement('div');
        row.className = 'entry-row';

        const inSpan = document.createElement('span');
        inSpan.className = 'time-in';
        inSpan.textContent = '▶ ' + e.in;

        const outSpan = document.createElement('span');
        outSpan.className = 'time-out';
        outSpan.textContent = '■ ' + e.out;

        const durSpan = document.createElement('span');
        durSpan.className = 'duration';
        durSpan.textContent = formatDur(calcDur(e.in, e.out));

        const noteInput = document.createElement('input');
        noteInput.type = 'text';
        noteInput.className = 'note-field';
        noteInput.value = e.note || '';
        noteInput.placeholder = 'add note...';
        noteInput.addEventListener('change', ev => updateNote(key, idx, ev.target.value));

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.textContent = '×';
        delBtn.title = 'Remove entry';
        delBtn.onclick = () => deleteEntry(key, idx);

        row.appendChild(inSpan);
        row.appendChild(outSpan);
        row.appendChild(durSpan);
        row.appendChild(noteInput);
        row.appendChild(delBtn);
        list.appendChild(row);
      });

      // Open session indicator
      if (dayData.open) {
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.style.borderColor = 'var(--green)';

        const inSpan = document.createElement('span');
        inSpan.className = 'time-in';
        inSpan.textContent = '▶ ' + dayData.open;

        const pulse = document.createElement('span');
        pulse.className = 'time-out';
        pulse.style.color = 'var(--amber)';
        pulse.textContent = '◉ running';

        const running = calcDur(dayData.open, nowHHMM());
        const durSpan = document.createElement('span');
        durSpan.className = 'duration';
        durSpan.style.color = 'var(--amber)';
        durSpan.textContent = running > 0 ? formatDur(running) : '...';

        const filler = document.createElement('span');
        const spacer = document.createElement('span');

        row.appendChild(inSpan);
        row.appendChild(pulse);
        row.appendChild(durSpan);
        row.appendChild(filler);
        row.appendChild(spacer);
        list.appendChild(row);
      }
    }

    // Actions
    const actions = document.createElement('div');
    actions.className = 'actions';

    if (!dayData.open) {
      const btnIn = document.createElement('button');
      btnIn.className = 'btn-stamp btn-in';
      btnIn.textContent = '▶ Clock In';
      btnIn.onclick = () => clockIn(key);
      actions.appendChild(btnIn);
    } else {
      const btnOut = document.createElement('button');
      btnOut.className = 'btn-stamp btn-out';
      btnOut.textContent = '■ Clock Out';
      btnOut.onclick = () => clockOut(key);
      actions.appendChild(btnOut);
    }

    const btnM = document.createElement('button');
    btnM.className = 'btn-stamp btn-manual';
    btnM.textContent = '+ Manual Entry';
    btnM.onclick = () => openManual(key);
    actions.appendChild(btnM);

    body.appendChild(list);
    body.appendChild(actions);

    card.appendChild(hdr);
    card.appendChild(body);
    grid.appendChild(card);
  }

  // Totals
  document.getElementById('total-hours').textContent = formatDur(totalMins);
  document.getElementById('total-sessions').textContent = totalSessions;
  const avg = workDaysWithEntries > 0 ? Math.floor(totalMins / workDaysWithEntries) : 0;
  document.getElementById('avg-day').textContent = formatDur(avg);
}

// Re-render every 30s to keep running sessions live
render();
setInterval(render, 30000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
